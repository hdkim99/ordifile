name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Release operation"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - promote-existing
      source_run_id:
        description: "Existing release run containing the immutable build artifact"
        required: false
        type: string
      release_tag:
        description: "Existing immutable release tag"
        required: false
        type: string
      expected_head_sha:
        description: "Expected commit targeted by the tag and source run"
        required: false
        type: string
      artifact_name:
        description: "Exact artifact name from the source build run"
        required: false
        type: string

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"

concurrency:
  group: ordifile-publish-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Validate and build once
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.mode == 'dry-run')
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Clean persistent workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Enforce release source, version, and tag policy
        id: gate
        shell: >-
          python scripts/ci/run_in_venv.py run --github-runner -- {0}
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          def git(*arguments: str, check: bool = True) -> str:
              result = subprocess.run(
                  ["git", *arguments],
                  check=check,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip()

          git("fetch", "--no-tags", "origin", "+refs/heads/main:refs/remotes/origin/main")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          if not isinstance(version, str) or re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit(f"Package version is not a strict X.Y.Z release version: {version!r}")

          event = os.environ["GITHUB_EVENT_NAME"]
          if event == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
                  raise SystemExit("Release tags must match vX.Y.Z exactly.")
              if tag != f"v{version}":
                  raise SystemExit(f"Tag {tag} does not match package version {version}.")
              reference = f"refs/tags/{tag}"
              if git("cat-file", "-t", reference) != "tag":
                  raise SystemExit("Release tags must be annotated tags.")
              payload = git("cat-file", "-p", reference)
              target_types = [
                  line.removeprefix("type ")
                  for line in payload.splitlines()
                  if line.startswith("type ")
              ]
              if target_types != ["commit"]:
                  raise SystemExit(
                      "Release tags must point directly to a commit, not another tag."
                  )
              ancestry = subprocess.run(
                  [
                      "git",
                      "merge-base",
                      "--is-ancestor",
                      f"{reference}^{{commit}}",
                      "refs/remotes/origin/main",
                  ],
                  check=False,
              )
              if ancestry.returncode != 0:
                  raise SystemExit("The tagged commit is not contained in origin/main.")
          elif event == "workflow_dispatch":
              if os.environ.get("DISPATCH_MODE") != "dry-run":
                  raise SystemExit("Manual release runs are validation-only dry runs.")
              if os.environ["GITHUB_REF"] != "refs/heads/main":
                  raise SystemExit(
                      "Manual release validation must be dispatched from the main branch."
                  )
              if git("rev-parse", "HEAD") != git("rev-parse", "refs/remotes/origin/main"):
                  raise SystemExit(
                      "Manual release validation must use the current origin/main commit."
                  )
          else:
              raise SystemExit(f"Unsupported release event: {event}")

          notes = pathlib.Path(f"docs/releases/v{version}.md")
          if not notes.is_file():
              raise SystemExit(f"Missing release notes: {notes}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as output:
              output.write(f"version={version}\n")
      - name: Install release tooling and project
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
      - name: Check formatting
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m ruff format --check .
      - name: Lint
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m ruff check .
      - name: Type check
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m mypy
      - name: Run unit and integration tests with branch coverage
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m pytest
      - name: Audit dependencies
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m pip_audit
      - name: Build wheel and source distribution
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m build
      - name: Verify release distributions
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner -- scripts/verify_release.py
          --dist-dir dist
          --expected-version "${{ steps.gate.outputs.version }}"
          --checksums dist/SHA256SUMS.txt
      - name: Assemble the immutable artifact payload
        shell: >-
          python scripts/ci/run_in_venv.py run --github-runner -- {0}
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          import os
          import pathlib
          import shutil

          staging = pathlib.Path("release-artifact")
          if staging.exists() or staging.is_symlink():
              raise SystemExit(
                  "Release artifact staging already exists; refusing stale payload files."
              )
          packages = staging / "packages"
          packages.mkdir(parents=True)
          distributions = (*pathlib.Path("dist").glob("*.whl"), *pathlib.Path("dist").glob("*.tar.gz"))
          if len(distributions) != 2:
              raise SystemExit("Expected exactly one wheel and one source distribution.")
          for distribution in distributions:
              shutil.copy2(distribution, packages / distribution.name)
          shutil.copy2("dist/SHA256SUMS.txt", staging / "SHA256SUMS.txt")
          version = os.environ["VERSION"]
          shutil.copy2(f"docs/releases/v{version}.md", staging / "release-notes.md")
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordifile-distributions-${{ github.run_id }}
          path: release-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean persistent workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post

  promote-validate-existing:
    name: Validate existing release artifact
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'promote-existing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.context.outputs.artifact-id }}
      artifact-name: ${{ steps.context.outputs.artifact-name }}
      source-run-id: ${{ steps.context.outputs.source-run-id }}
      release-tag: ${{ steps.context.outputs.release-tag }}
      expected-head-sha: ${{ steps.context.outputs.expected-head-sha }}
    steps:
      - name: Check out the reviewed promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch inputs against the audited recovery
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py request \
            --source-run-id "$SOURCE_RUN_ID" \
            --release-tag "$RELEASE_TAG" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --artifact-name "$ARTIFACT_NAME"
      - name: Read source run, artifact, and live tag metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir promotion-metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > promotion-metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            > promotion-metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > promotion-metadata/artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > promotion-metadata/tag-ref.json
          tag_object_sha="$(python - <<'PY'
          import json
          import re

          with open("promotion-metadata/tag-ref.json", encoding="utf-8") as source:
              value = json.load(source).get("object", {}).get("sha")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
              raise SystemExit("GitHub returned an invalid annotated-tag object SHA")
          print(value)
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            > promotion-metadata/tag-object.json
      - name: Validate the source workflow and immutable artifact identity
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py source \
            --source-run-id "$SOURCE_RUN_ID" \
            --release-tag "$RELEASE_TAG" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-json promotion-metadata/run.json \
            --jobs-json promotion-metadata/jobs.json \
            --artifacts-json promotion-metadata/artifacts.json \
            --tag-ref-json promotion-metadata/tag-ref.json \
            --tag-object-json promotion-metadata/tag-object.json
      - name: Require the tagged commit and workflow commit in current main
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" refs/remotes/origin/main
      - name: Require empty indexes and no existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py index-absent --index testpypi
          python scripts/verify_release_promotion.py index-absent --index pypi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The v0.2.1 GitHub Release already exists." >&2
            exit 1
          fi
      - name: Check out the exact tagged source for archive comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          path: tagged-source
          persist-credentials: false
          ref: 33e1b6ec4d6d822e1a0b532e0d075adc4d79c788
      - name: Download the exact source artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 9272226213
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact
          repository: hdkim99/ordifile
          run-id: 31980576873
      - name: Verify package bytes, archives, metadata, licenses, and notes
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py artifact --root release-artifact
          python scripts/verify_release.py \
            --dist-dir release-artifact/packages \
            --source-root tagged-source \
            --expected-version 0.2.1 \
            --tag v0.2.1 \
            --checksums "$RUNNER_TEMP/promotion-SHA256SUMS.txt" \
            --skip-smoke
          cmp "$RUNNER_TEMP/promotion-SHA256SUMS.txt" release-artifact/SHA256SUMS.txt
          cmp tagged-source/docs/releases/v0.2.1.md release-artifact/release-notes.md
      - name: Export the validated immutable context
        id: context
        run: |
          set -euo pipefail
          {
            echo 'artifact-id=9272226213'
            echo 'artifact-name=ordifile-distributions-31980576873'
            echo 'source-run-id=31980576873'
            echo 'release-tag=v0.2.1'
            echo 'expected-head-sha=33e1b6ec4d6d822e1a0b532e0d075adc4d79c788'
          } >> "$GITHUB_OUTPUT"

  promote-testpypi:
    name: Promote existing v0.2.1 distributions to TestPyPI
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'promote-existing'
    needs: promote-validate-existing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ordifile
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the reviewed promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Download the validated source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-validate-existing.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact
          repository: hdkim99/ordifile
          run-id: ${{ needs.promote-validate-existing.outputs.source-run-id }}
      - name: Revalidate artifact and empty package indexes
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py artifact --root release-artifact
          python scripts/verify_release_promotion.py index-absent --index testpypi
          python scripts/verify_release_promotion.py index-absent --index pypi
      - name: Revalidate the live annotated tag immediately before TestPyPI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.promote-validate-existing.outputs.release-tag }}
        run: |
          set -euo pipefail
          mkdir live-tag
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > live-tag/ref.json
          tag_object_sha="$(python - <<'PY'
          import json
          import re

          with open("live-tag/ref.json", encoding="utf-8") as source:
              value = json.load(source).get("object", {}).get("sha")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
              raise SystemExit("GitHub returned an invalid annotated-tag object SHA")
          print(value)
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" > live-tag/object.json
          python scripts/verify_release_promotion.py tag \
            --tag-ref-json live-tag/ref.json \
            --tag-object-json live-tag/object.json
      - name: Publish the existing distributions to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-artifact/packages/
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  promote-verify-testpypi:
    name: Verify promoted TestPyPI bytes
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'promote-existing'
    needs: [promote-validate-existing, promote-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the reviewed promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Download the validated source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-validate-existing.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact
          repository: hdkim99/ordifile
          run-id: ${{ needs.promote-validate-existing.outputs.source-run-id }}
      - name: Verify exact TestPyPI filenames, hashes, and bytes
        run: python scripts/verify_release_promotion.py index --index testpypi --root release-artifact

  promote-attest:
    name: Attest the promoted v0.2.1 distributions
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'promote-existing'
    needs: [promote-validate-existing, promote-verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - name: Check out the reviewed promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Download the validated source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-validate-existing.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact
          repository: hdkim99/ordifile
          run-id: ${{ needs.promote-validate-existing.outputs.source-run-id }}
      - name: Revalidate the immutable artifact
        run: python scripts/verify_release_promotion.py artifact --root release-artifact
      - name: Attest the exact promoted artifact bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifact/packages/*
            release-artifact/SHA256SUMS.txt

  promote-create-github-release:
    name: Create the promoted v0.2.1 draft GitHub Release
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'promote-existing'
    needs: [promote-validate-existing, promote-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the reviewed promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Download the validated source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-validate-existing.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact
          repository: hdkim99/ordifile
          run-id: ${{ needs.promote-validate-existing.outputs.source-run-id }}
      - name: Revalidate artifact and require no existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.promote-validate-existing.outputs.release-tag }}
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py artifact --root release-artifact
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The v0.2.1 GitHub Release already exists." >&2
            exit 1
          fi
      - name: Create a draft from the same promoted distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.promote-validate-existing.outputs.release-tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-artifact/packages/*.whl \
            release-artifact/packages/*.tar.gz \
            release-artifact/SHA256SUMS.txt \
            --verify-tag \
            --draft \
            --title "Ordifile $RELEASE_TAG" \
            --notes-file release-artifact/release-notes.md

  promote-pypi:
    name: Promote existing v0.2.1 distributions to PyPI
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'promote-existing'
    needs: [promote-validate-existing, promote-create-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/ordifile
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the reviewed promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Download the validated source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-validate-existing.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact
          repository: hdkim99/ordifile
          run-id: ${{ needs.promote-validate-existing.outputs.source-run-id }}
      - name: Require exact TestPyPI bytes and an empty PyPI version
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py index --index testpypi --root release-artifact
          python scripts/verify_release_promotion.py index-absent --index pypi
      - name: Revalidate the live annotated tag immediately before PyPI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.promote-validate-existing.outputs.release-tag }}
        run: |
          set -euo pipefail
          mkdir live-tag
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > live-tag/ref.json
          tag_object_sha="$(python - <<'PY'
          import json
          import re

          with open("live-tag/ref.json", encoding="utf-8") as source:
              value = json.load(source).get("object", {}).get("sha")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
