      - name: Verify the live annotated tag still targets this commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/run_in_venv.py run --github-runner -- - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected_commit = os.environ["GITHUB_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Cache-Control": "no-cache",
              "User-Agent": "Ordifile-release-tag-verifier",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def read_json(path: str) -> dict[str, object]:
              request = Request(f"https://api.github.com/repos/{repository}/{path}", headers=headers)
              with urlopen(request, timeout=20) as response:
                  value = json.load(response)
              if not isinstance(value, dict):
                  raise SystemExit("GitHub returned an invalid tag response")
              return value

          reference = read_json(f"git/ref/tags/{quote(tag, safe='')}")
          target = reference.get("object")
          if not isinstance(target, dict) or target.get("type") != "tag":
              raise SystemExit("The live release ref is no longer an annotated tag")
          annotation = read_json(f"git/tags/{target.get('sha', '')}")
          commit = annotation.get("object")
          if (
              not isinstance(commit, dict)
              or commit.get("type") != "commit"
              or commit.get("sha") != expected_commit
          ):
