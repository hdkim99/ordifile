name: Agilent Result XML external fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordifile-agilent-result-xml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-agilent-result-xml:
    name: External / Agilent ChemStation Result XML
    if: github.repository == 'hdkim99/ordifile'
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 30
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Clean workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install project in the isolated environment
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
      - name: Fetch the reviewed exact fixture without logging its content
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner --
          scripts/fetch_external_fixture.py
          docs/research/agilent-result-xml-external-fixture-manifest.json
          --cache-dir "$RUNNER_TEMP/ordifile-agilent-result-xml-fixture"
          --accept-license CECILL-2.1-IFPEN-GC2ASM-RESULT-XML
          --allow-ci
      - name: Run exact external fixture integration
        run: |
          export ORDIFILE_AGILENT_RESULT_XML_FIXTURE="$RUNNER_TEMP/ordifile-agilent-result-xml-fixture/downloads/ifpen-gc2asm-agilent-result-xml-c0110/4c876bb5712b2d943b5ad32ce5854698018e0b82f2dfc10cc0971ffab9a7056f/Result.xml"
          python scripts/ci/run_in_venv.py run --github-runner -- -m pytest --no-cov --basetemp "$RUNNER_TEMP/ordifile-agilent-result-xml-fixture/pytest" tests/external/test_agilent_chemstation_result_xml_real.py
      - name: Remove exact external fixture cache
        if: always()
        shell: python {0}
        run: |
          import os
          import pathlib
          import shutil

          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ordifile-agilent-result-xml-fixture"
          if target.exists():
              shutil.rmtree(target)
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post
