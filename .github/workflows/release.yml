  verify-testpypi:
    name: Verify exact TestPyPI distributions
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release source for workspace cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Clean persistent workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Download the immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ordifile-distributions-${{ github.run_id }}
          path: release-artifact
      - name: Download both files directly from TestPyPI and compare bytes
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/ci/run_in_venv.py run --github-runner -- - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse
          from urllib.request import urlopen

          root = Path("release-artifact")
          packages = root / "packages"
          manifest = {}
          for line in (root / "SHA256SUMS.txt").read_text(encoding="ascii").splitlines():
              expected, filename = line.split(maxsplit=1)
              if Path(filename).name != filename or filename in manifest:
                  raise SystemExit(f"Unsafe or duplicate checksum filename: {filename!r}")
              path = packages / filename
              content = path.read_bytes()
              if hashlib.sha256(content).hexdigest() != expected:
                  raise SystemExit(f"Checksum mismatch for {filename}")
              manifest[filename] = expected

          built_files = sorted((*packages.glob("*.whl"), *packages.glob("*.tar.gz")))
          built = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in built_files
          }
          if len(built_files) != 2 or built != manifest:
              raise SystemExit("Local package files do not exactly match SHA256SUMS.txt")

          version = os.environ["VERSION"]
          endpoint = f"https://test.pypi.org/pypi/ordifile/{version}/json"
          destination = Path(os.environ["RUNNER_TEMP"]) / "testpypi-download"
          destination.mkdir(parents=True, exist_ok=True)
          for attempt in range(1, 7):
              try:
                  with urlopen(endpoint, timeout=30) as response:
                      payload = json.load(response)
                  published = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload["urls"]
                  }
                  if len(payload["urls"]) != len(manifest) or published != manifest:
                      raise ValueError("file set or SHA-256 values differ from the build")
                  for item in payload["urls"]:
                      filename = item["filename"]
                      url = item["url"]
                      parsed = urlparse(url)
                      if parsed.scheme != "https" or parsed.hostname != "test-files.pythonhosted.org":
                          raise ValueError(f"unexpected TestPyPI file URL: {url!r}")
                      with urlopen(url, timeout=60) as response:
                          final = urlparse(response.geturl())
                          if final.scheme != "https" or final.hostname != parsed.hostname:
                              raise ValueError("TestPyPI file download redirected off the expected host")
                          content = response.read(64 * 1024 * 1024 + 1)
                      if len(content) > 64 * 1024 * 1024:
                          raise ValueError(f"published file exceeds verification bound: {filename}")
                      if content != (packages / filename).read_bytes():
                          raise ValueError(f"downloaded bytes differ from build: {filename}")
                      (destination / filename).write_bytes(content)
                  break
              except (HTTPError, URLError, TimeoutError, ValueError, KeyError, json.JSONDecodeError) as error:
                  for path in destination.iterdir():
                      if path.is_file():
                          path.unlink()
                  if attempt == 6:
                      raise SystemExit(f"TestPyPI verification failed: {error}") from error
                  time.sleep(10)

          downloaded = sorted((*destination.glob("*.whl"), *destination.glob("*.tar.gz")))
          if {path.name for path in downloaded} != set(manifest):
              raise SystemExit("Downloaded TestPyPI file set is incomplete")
          wheel = next(destination.glob("*.whl"))
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--no-cache-dir", str(wheel)]
          )
          executable = shutil.which("ordifile")
          if executable is None:
              raise SystemExit("Verified TestPyPI wheel did not install the ordifile entry point")
          with tempfile.TemporaryDirectory(prefix="ordifile-testpypi-smoke-") as work:
              subprocess.check_call([executable, "--version"], cwd=work)
              subprocess.check_call([executable, "formats"], cwd=work)
          PY
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean persistent workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post

