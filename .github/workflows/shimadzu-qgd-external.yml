name: Shimadzu QGD external fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordifile-shimadzu-qgd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-qgd:
    name: External / Shimadzu GCMSsolution QGD
    if: github.repository == 'hdkim99/ordifile'
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 60
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Clean workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install project in the isolated environment
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
      - name: Fetch the reviewed exact fixture without logging its content
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner --
          scripts/fetch_external_fixture.py
          docs/research/shimadzu-qgd-external-fixture-manifest.json
          --cache-dir "$RUNNER_TEMP/ordifile-shimadzu-qgd-fixture"
          --accept-license CC0-1.0-B4NF-7-C23-QGD
          --allow-ci
      - name: Run exact external fixture integration
        run: |
          export ORDIFILE_SHIMADZU_QGD_FIXTURE="$RUNNER_TEMP/ordifile-shimadzu-qgd-fixture/downloads/chromconverter-extra-b4nf-7-c23-qgd/64b2faab81c0ad10bc36c57b23ed770751dbe5253f48d2a13b8b15df1de23f5d/B4NF.7_C23.qgd"
          python scripts/ci/run_in_venv.py run --github-runner -- -m pytest --no-cov --basetemp "$RUNNER_TEMP/ordifile-shimadzu-qgd-fixture/pytest" tests/external/test_shimadzu_gcmssolution_qgd_real.py
      - name: Remove exact external fixture cache
        if: always()
        shell: python {0}
        run: |
          import os
          import pathlib
          import shutil

          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ordifile-shimadzu-qgd-fixture"
          if target.exists():
              shutil.rmtree(target)
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post
