name: Ordifile Windows standalone prototype

on:
  workflow_call:
    inputs:
      expected_commit:
        description: Exact reviewed Ordifile 40-character commit
        required: true
        type: string

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONUTF8: "1"

jobs:
  caller-preflight:
    name: Validate reusable Windows caller identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject an unauthorized or mutable caller
        shell: bash
        env:
          CALLED_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_OWNER: ${{ github.repository_owner }}
          CALLER_REF: ${{ github.ref }}
          CALLER_REF_TYPE: ${{ github.ref_type }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          expected_called_ref="hdkim99/ordifile/.github/workflows/standalone-windows-reusable.yml@$EXPECTED_COMMIT"
          expected_caller_suffix="/.github/workflows/ordifile-windows-validation.yml@refs/heads/main"
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ||
                "$CALLER_OWNER" != "hdkim99" ||
                "$CALLER_EVENT" != "workflow_dispatch" ||
                "$CALLER_REF_TYPE" != "branch" ||
                "$CALLER_REF" != "refs/heads/main" ||
                "$CALLER_WORKFLOW_REF" != *"$expected_caller_suffix" ||
                "$CALLED_WORKFLOW_REPOSITORY" != "hdkim99/ordifile" ||
                "$CALLED_WORKFLOW_PATH" != ".github/workflows/standalone-windows-reusable.yml" ||
                "$CALLED_WORKFLOW_REF" != "$expected_called_ref" ||
                "$CALLED_WORKFLOW_SHA" != "$EXPECTED_COMMIT" ]]; then
            echo "Reusable Windows caller identity is invalid." >&2
            exit 1
          fi

  windows-prototype:
    name: Build and smoke unsigned Windows prototype
    needs: caller-preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      PSExecutionPolicyPreference: Bypass
    steps:
      - name: Mask persistent runner identifiers
        shell: pwsh
        run: |
          $values = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            $env:RUNNER_TOOL_CACHE,
            $env:RUNNER_WORKSPACE,
            $env:AGENT_TOOLSDIRECTORY,
            $env:RUNNER_NAME,
            $env:USERNAME,
            $env:USERPROFILE,
            $env:COMPUTERNAME,
            $env:USERDOMAIN
          ) | Where-Object { $_ }
          foreach ($value in $values) {
            Write-Output "::add-mask::$value"
          }
      - name: Check out reviewed Ordifile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          path: source
          persist-credentials: false
          repository: hdkim99/ordifile
          ref: ${{ inputs.expected_commit }}
      - name: Verify exact reviewed source
        shell: pwsh
        working-directory: source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw "Expected commit identity is invalid."
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_COMMIT) {
            throw "Checked-out commit does not match the reviewed commit."
          }
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.3"
      - name: Clean persistent workspace before job
        working-directory: source
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Bootstrap exact official job-local Zig
        working-directory: source
        run: python scripts/standalone/windows_zig.py bootstrap
      - name: Prove job-local Zig native compile and link
        working-directory: source
        run: python scripts/standalone/windows_zig.py verify-native
      - name: Create isolated Windows job environment
        working-directory: source
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install exact standalone toolchain
        working-directory: source
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --quiet --requirement packaging/standalone/requirements-build.lock
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --quiet --no-deps .
      - name: Prove exact plain Python and Nuitka Zig standalone path
        working-directory: source
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner --
          scripts/standalone/windows_zig.py verify-nuitka
      - name: Prove exact PySide6 and Nuitka Zig standalone path
        working-directory: source
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner --
          scripts/standalone/windows_zig.py verify-pyside
      - name: Create public checkout-independent smoke kit
        working-directory: source
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner -- scripts/standalone/smoke.py make-kit
          --output standalone-smoke-kit
          --generator-root tests/fixtures/synthetic
      - name: Build and audit native candidate
        working-directory: source
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner -- scripts/standalone/build.py
          --source .
          --output standalone-candidate
          --commit "${{ inputs.expected_commit }}"
          --target windows-x86_64
      - name: Smoke immutable Windows bytes outside the checkout
        shell: pwsh
        working-directory: source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "source"
          $candidate = Join-Path $source "standalone-candidate"
          $scratchName = "ordifile-standalone-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          if ($scratchName -notmatch '^ordifile-standalone-[0-9]+-[0-9]+-[A-Za-z0-9_-]+$') {
            throw "Standalone scratch identity is invalid."
          }
          $trimCharacters = [char[]]@(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd($trimCharacters)
          $scratch = [IO.Path]::GetFullPath((Join-Path $runnerTemp $scratchName))
          if ([IO.Path]::GetDirectoryName($scratch).TrimEnd($trimCharacters) -ne $runnerTemp) {
            throw "Standalone scratch boundary is invalid."
          }
          $createdScratch = New-Item -ItemType Directory -Path $scratch -ErrorAction Stop
          if (
            -not ($createdScratch -is [System.IO.DirectoryInfo]) -or
            -not $createdScratch.PSIsContainer -or
            ($createdScratch.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
            -not ([IO.Path]::GetFullPath($createdScratch.FullName)).Equals(
              $scratch,
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw "Standalone scratch ownership is invalid."
          }
          $cleanupToken = [Guid]::NewGuid().ToString("N")
          $cleanupMarker = Join-Path $scratch ".ordifile-standalone-owned"
          $markerBytes = [Text.UTF8Encoding]::new($false).GetBytes($cleanupToken)
          $markerStream = [IO.File]::Open(
            $cleanupMarker,
            [IO.FileMode]::CreateNew,
            [IO.FileAccess]::Write,
            [IO.FileShare]::None
          )
          try {
            $markerStream.Write($markerBytes, 0, $markerBytes.Length)
          }
          finally {
            $markerStream.Dispose()
          }
          $markerItem = Get-Item -LiteralPath $cleanupMarker -Force -ErrorAction Stop
          if (
            -not ($markerItem -is [System.IO.FileInfo]) -or
            $markerItem.PSIsContainer -or
            ($markerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
            [IO.File]::ReadAllText($cleanupMarker, [Text.Encoding]::UTF8) -cne $cleanupToken
          ) {
            throw "Standalone scratch marker is invalid."
          }
          $escapedToken = $cleanupToken.Replace("%", "%25")
          Write-Output "::add-mask::$escapedToken"
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "ORDIFILE_STANDALONE_CLEANUP_TOKEN=$cleanupToken$([Environment]::NewLine)",
            [Text.UTF8Encoding]::new($false)
          )
          Copy-Item -LiteralPath (Join-Path $source "standalone-smoke-kit") `
            -Destination (Join-Path $scratch "kit") -Recurse
          $archives = @(Get-ChildItem -LiteralPath $candidate -Filter "Ordifile-*.zip" -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one standalone archive." }
          $checksum = (Get-Content -LiteralPath (Join-Path $candidate "SHA256SUMS.txt") -Raw).Trim()
          $parts = $checksum -split '\s+', 2
          if ($parts.Count -ne 2 -or $parts[1] -ne $archives[0].Name) {
            throw "Standalone checksum inventory is invalid."
          }
          if ((Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $parts[0]) {
            throw "Standalone archive checksum mismatch."
          }
          $manifest = Get-Content -LiteralPath (Join-Path $candidate "standalone-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.publishable -ne $false -or
              $manifest.signature_state -ne "UNSIGNED_PROTOTYPE" -or
              $manifest.packaging_backend -ne "DIRECT_NUITKA_ZIG" -or
              $manifest.toolchain.Zig -ne "0.16.0" -or
              $manifest.toolchain.Nuitka -ne "4.1.3") {
            throw "Prototype publication/signature gate is invalid."
          }
          if ($manifest.outer_artifact.filename -ne $archives[0].Name -or
              $manifest.outer_artifact.sha256 -ne $parts[0] -or
              $manifest.outer_artifact.size -ne $archives[0].Length -or
              $manifest.bundle_total_size -le 0) {
            throw "Standalone manifest outer artifact identity is invalid."
          }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath (Join-Path $scratch "expanded")
          $expandedRoot = [IO.Path]::GetFullPath((Join-Path $scratch "expanded")).TrimEnd($trimCharacters)
          $expandedEntries = @(Get-ChildItem -LiteralPath $expandedRoot -Force)
          if ($expandedEntries.Count -ne 1 -or
              -not $expandedEntries[0].PSIsContainer -or
              ($expandedEntries[0].Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "Standalone archive root inventory is invalid."
          }
          $bundleRoot = [IO.Path]::GetFullPath($expandedEntries[0].FullName).TrimEnd($trimCharacters)
          $bundleBoundary = "$bundleRoot$([IO.Path]::DirectorySeparatorChar)"
          $executableEntries = @(
            $manifest.files | Where-Object {
              $relativePath = [string]$_.path
              $normalizedPath = $relativePath.Replace("/", [IO.Path]::DirectorySeparatorChar)
              $_.kind -eq "file" -and
                [IO.Path]::GetFileName($normalizedPath) -ieq "Ordifile.exe"
            }
          )
          if ($executableEntries.Count -ne 1) {
            throw "Standalone manifest executable inventory is invalid."
          }
          $relativeExecutable = [string]$executableEntries[0].path
          if ([IO.Path]::IsPathRooted($relativeExecutable)) {
            throw "Standalone manifest executable path is invalid."
          }
          $executablePath = [IO.Path]::GetFullPath(
            (Join-Path $bundleRoot $relativeExecutable.Replace("/", [IO.Path]::DirectorySeparatorChar))
          )
          if (-not $executablePath.StartsWith($bundleBoundary, [StringComparison]::OrdinalIgnoreCase) -or
              -not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Standalone manifest executable path is invalid."
          }
          $executables = @((Get-Item -LiteralPath $executablePath))
          python scripts/ci/run_in_venv.py run --github-runner -- scripts/standalone/verify.py `
            --bundle $bundleRoot `
            --manifest (Join-Path $candidate "standalone-manifest.json") `
            --commit $env:EXPECTED_COMMIT `
            --target windows-x86_64
          $env:PYTHONPATH = ""
          $env:PYTHONNOUSERSITE = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          Push-Location $scratch
          try {
            & $executables[0].FullName --standalone-smoke `
              --kit (Join-Path $scratch "kit") `
              --output (Join-Path $scratch "standalone smoke 결과.xlsx") `
              --report (Join-Path $scratch "standalone smoke report.json")
            if ($LASTEXITCODE -ne 0) { throw "Packaged Ordifile smoke failed." }
            & $executables[0].FullName --standalone-window-smoke
            if ($LASTEXITCODE -ne 0) { throw "Packaged Ordifile window smoke failed." }
          } finally {
            Pop-Location
          }
          $report = Get-Content -LiteralPath (Join-Path $scratch "standalone smoke report.json") -Raw | ConvertFrom-Json
          if ($report.status -ne "PASS" -or $report.existing_output_preserved -ne $true) {
            throw "Packaged Ordifile smoke report is not PASS."
          }
          Copy-Item -LiteralPath (Join-Path $scratch "standalone smoke report.json") `
            -Destination (Join-Path $source "standalone-smoke-report.json")
      - name: Require complete Windows evidence after a successful smoke
        if: success()
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = @(
            "standalone-candidate/standalone-manifest.json",
            "standalone-candidate/SHA256SUMS.txt",
            "standalone-smoke-report.json"
          )
          $missing = @($evidence | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf)
          })
          if ($missing.Count -ne 0) {
            throw "Standalone Windows evidence inventory is incomplete."
          }
      - name: Upload path-free Windows evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordifile-standalone-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/standalone-candidate/standalone-manifest.json
            source/standalone-candidate/SHA256SUMS.txt
            source/standalone-smoke-report.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          compression-level: 0
          retention-days: 7
          overwrite: false
      - name: Remove isolated Windows job environment
        if: always()
        working-directory: source
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Remove bounded Windows standalone scratch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $identity = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          if ($identity -notmatch '^[0-9]+-[0-9]+-windows-prototype$') {
            throw "Standalone scratch identity is invalid."
          }
          $trimCharacters = [char[]]@(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd($trimCharacters)
          $scratch = [IO.Path]::GetFullPath(
            (Join-Path $runnerTemp "ordifile-standalone-$identity")
          )
          $parent = [IO.Path]::GetDirectoryName($scratch).TrimEnd($trimCharacters)
          if (-not $parent.Equals($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Standalone scratch boundary is invalid."
          }
          try {
            $scratchItem = Get-Item -LiteralPath $scratch -Force -ErrorAction Stop
          }
          catch [System.Management.Automation.ItemNotFoundException] {
            exit 0
          }
          if (
            -not ($scratchItem -is [System.IO.DirectoryInfo]) -or
            -not $scratchItem.PSIsContainer -or
            ($scratchItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
            -not ([IO.Path]::GetFullPath($scratchItem.FullName)).Equals(
              $scratch,
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw "Standalone scratch cleanup failed."
          }
          $marker = Join-Path $scratch ".ordifile-standalone-owned"
          $markerItem = Get-Item -LiteralPath $marker -Force -ErrorAction Stop
          if (
            [string]::IsNullOrWhiteSpace($env:ORDIFILE_STANDALONE_CLEANUP_TOKEN) -or
            -not ($markerItem -is [System.IO.FileInfo]) -or
            $markerItem.PSIsContainer -or
            ($markerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
            [IO.File]::ReadAllText($marker, [Text.Encoding]::UTF8) -cne
              $env:ORDIFILE_STANDALONE_CLEANUP_TOKEN
          ) {
            throw "Standalone scratch cleanup failed."
          }
          Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction Stop *> $null
          if (Test-Path -LiteralPath $scratch -ErrorAction Stop) {
            throw "Standalone scratch cleanup failed."
          }
      - name: Remove bounded job-local Zig toolchain
        if: always()
        working-directory: source
        run: python scripts/standalone/windows_zig.py cleanup
      - name: Clean persistent workspace after job
        if: always()
        working-directory: source
        run: python scripts/ci/clean_workspace.py --workspace . --phase post
