name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ordifile-ci-${{ github.event_name == 'pull_request' &&
    format('pr-{0}-{1}', github.event.pull_request.number, github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: CI / required
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.actor == 'dependabot[bot]') &&
      fromJSON('["self-hosted","ordifile-pr-ephemeral"]') ||
      fromJSON('["self-hosted","ordifile-trusted"]') }}
    timeout-minutes: 45
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out routed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Clean workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install project in the isolated environment
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
      - name: Check formatting
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m ruff format --check .
      - name: Lint
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m ruff check .
      - name: Type check
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m mypy
      - name: Unit and integration tests
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m pytest
      - name: Build distributions
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m build
      - name: Validate package metadata
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner -- -c "import pathlib, zipfile;
          wheel=next(pathlib.Path('dist').glob('*.whl'));
          z=zipfile.ZipFile(wheel);
          metadata=z.read(next(n for n in z.namelist() if n.endswith('METADATA'))).decode();
          assert 'License-Expression: Apache-2.0' in metadata;
          assert 'License-File: LICENSE' in metadata;
          assert 'License-File: NOTICE' in metadata;
          assert 'License-File: THIRD_PARTY_NOTICES.md' in metadata"
      - name: CLI smoke test
        run: python scripts/ci/run_in_venv.py run --github-runner --executable ordifile -- --help
      - name: Audit dependencies
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m pip_audit
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post
