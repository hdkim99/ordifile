name: Researcher pilot feedback
description: Report a privacy-safe success, partial result, failure, or workflow friction.
title: "pilot: "
labels: ["testing"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach laboratory source files, Mapping or Recipe JSON, detailed logs, or workbooks. Remove personal, sample, organization, local-path, account, and instrument identifiers. A short sanitized status or error code is enough.
  - type: input
    id: version
    attributes:
      label: Ordifile version
      placeholder: "Paste the output of: ordifile --version"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface used
      options: [CLI, GUI, Python API]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task attempted
      description: For example, mapped two recurring templates into one workbook.
    validations:
      required: true
  - type: input
    id: inputs
    attributes:
      label: Number and type of files
      description: Give only a count range and public format IDs; do not list filenames.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options: [Success, Partial success, Failure]
    validations:
      required: true
  - type: checkboxes
    id: workbook_review
    attributes:
      label: Workbook checks completed
      options:
        - label: Samples and Import_Log
        - label: Peaks and source-row comparison
        - label: RT, Area, Height, and units
        - label: Relevant 1D or 2D matrices
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Actual friction or unclear step
      description: Include only sanitized status or error codes when relevant.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe the researcher workflow need rather than private file contents.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include private scientific files, measured rows, paths, identifiers, credentials, or local configuration.
          required: true
