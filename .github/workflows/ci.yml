name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordifile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: CI / required
    # Only owner-authored same-repository PRs may execute on persistent research hardware.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 60
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Reject automated-tool contributor attribution
        env:
          ORDIFILE_EVENT_NAME: ${{ github.event_name }}
        run: >-
          python scripts/ci/verify_contributor_attribution.py
          --event "$GITHUB_EVENT_PATH"
          --event-name "$ORDIFILE_EVENT_NAME"
      - name: Clean workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install project in the isolated environment
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
      - name: Check formatting
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m ruff format --check .
      - name: Lint
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m ruff check .
      - name: Type check
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m mypy
      - name: Unit and integration tests
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m pytest
      - name: Build wheel and source distribution
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m build
      - name: Verify distributions and clean-wheel behavior
        shell: python scripts/ci/run_in_venv.py run --github-runner -- {0}
        run: |
          import pathlib
          import subprocess
          import sys
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          subprocess.run(
              [
                  sys.executable,
                  "scripts/verify_release.py",
                  "--dist-dir",
                  "dist",
                  "--expected-version",
                  version,
                  "--checksums",
                  "dist/SHA256SUMS.txt",
              ],
              check=True,
          )
      - name: Exercise installed CLI and workbook output
        shell: python scripts/ci/run_in_venv.py run --github-runner -- {0}
        run: |
          import importlib.util
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          from openpyxl import load_workbook

          executable = pathlib.Path(sys.executable).with_name("ordifile")
          for arguments in (
              ("--help",),
              ("--version",),
              ("formats",),
              ("inspect", "examples/basic/sample_1.csv"),
          ):
              subprocess.run([str(executable), *arguments], check=True)
          with tempfile.TemporaryDirectory(
              prefix="ordifile-ci-smoke-", dir=os.environ["RUNNER_TEMP"]
          ) as temporary:
              output = pathlib.Path(temporary) / "Ordifile_Result.xlsx"
              subprocess.run(
                  [
                      str(executable),
                      "convert",
                      "examples/basic",
                      "--sort",
                      "filename",
                      "--output",
                      str(output),
                  ],
                  check=True,
              )
              workbook = load_workbook(output, read_only=True, data_only=True)
              try:
                  assert {
                      "Manifest",
                      "Samples",
                      "Peak_Matrix",
                      "Peaks",
                      "Metadata",
                      "Import_Log",
                  }.issubset(workbook.sheetnames)
                  samples = list(workbook["Samples"].iter_rows(values_only=True))
                  assert [row[1] for row in samples[1:]] == [
                      "sample_1",
                      "sample_2",
                      "sample_10",
                  ]
              finally:
                  workbook.close()
          assert importlib.util.find_spec("labconvert") is None
          assert not executable.with_name("labconvert").exists()
      - name: Exercise installed wheel GUI and local Recipe library
        shell: python scripts/ci/run_in_venv.py run --github-runner -- {0}
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import venv

          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          with tempfile.TemporaryDirectory(
              prefix="ordifile-ci-gui-wheel-", dir=os.environ["RUNNER_TEMP"]
          ) as raw_temporary:
              temporary = pathlib.Path(raw_temporary)
              environment_root = temporary / "venv"
              venv.EnvBuilder(with_pip=True).create(environment_root)
              executable = environment_root / "bin" / "python"
              subprocess.check_call(
                  [
                      str(executable),
                      "-m",
                      "pip",
                      "install",
                      "--no-cache-dir",
                      f"ordifile[gui] @ {wheel.as_uri()}",
                  ]
              )
              subprocess.check_call([str(executable), "-m", "pip", "check"])
              smoke = """
          from PySide6.QtCore import QTimer
          from ordifile import ConversionRecipe
          from ordifile.desktop.app import create_application
          from ordifile.desktop.recipe_library import RecipeLibrary
          from ordifile.desktop.window import MainWindow

          app = create_application([])
          library = RecipeLibrary.standard()
          stored = library.create(ConversionRecipe(), "Installed wheel smoke")
          window = MainWindow()
          index = window.recipe_combo.findData(stored.recipe_id)
          if index < 1:
              raise SystemExit("Installed GUI did not discover the saved Recipe")
          window.recipe_combo.setCurrentIndex(index)
          window.recipe_combo.activated.emit(index)
          required = (
              window.recipe_combo,
              window.save_recipe_button,
              window.manage_recipes_button,
              window.refresh_preflight_button,
              window.convert_button,
          )
          if app.applicationName() != "Ordifile" or any(widget is None for widget in required):
              raise SystemExit("Installed GUI resources are incomplete")
          if window.conversion_recipe is None:
              raise SystemExit("Installed GUI did not apply the selected Recipe")
          window.show()
          QTimer.singleShot(50, window.close)
          QTimer.singleShot(50, app.quit)
          if app.exec() != 0:
              raise SystemExit("Installed GUI did not exit normally")
          """
              environment = os.environ.copy()
              environment.update(
                  {
                      "PYTHONNOUSERSITE": "1",
                      "PYTHONPATH": "",
                      "QT_QPA_PLATFORM": "offscreen",
                      "XDG_CONFIG_HOME": os.fspath(temporary / "config"),
                  }
              )
              subprocess.check_call(
                  [str(executable), "-c", smoke],
                  cwd=temporary,
                  env=environment,
              )
      - name: Audit dependencies
        run: python scripts/ci/run_in_venv.py run --github-runner -- -m pip_audit
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post

  python-compatibility:
    name: CI / Python ${{ matrix.python }} compatibility
    # Apply the same external/bot PR security boundary to every DGX job.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Clean workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install and test the supported Python version
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
          python scripts/ci/run_in_venv.py run --github-runner -- -m pytest --no-cov
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip check
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post
