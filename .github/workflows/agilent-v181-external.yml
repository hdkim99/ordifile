name: Agilent v181 external fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordifile-agilent-v181-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-v181:
    name: External / Agilent CH v181
    if: github.repository == 'hdkim99/ordifile'
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 30
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Clean workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install project in the isolated environment
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
      - name: Fetch the reviewed exact fixture
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner --
          scripts/fetch_external_fixture.py
          docs/research/external-fixture-manifest.json
          --cache-dir "$RUNNER_TEMP/ordifile-agilent-v181-fixture"
          --accept-license BSEE-Public-Information-2026-08-16
          --allow-ci
          --privacy-minimal-output
      - name: Run exact external fixture integration
        run: |
          export ORDIFILE_AGILENT_CH_V181_FIXTURE="$RUNNER_TEMP/ordifile-agilent-v181-fixture/downloads/bsee-g6151510-fid1a-v181/9abeb86b09d54c10e81f46648804acc0319b6e1d014cee54034eae91331f97ef/FID1A.CH"
          python scripts/ci/run_in_venv.py run --github-runner -- -m pytest --no-cov tests/external/test_agilent_chemstation_ch_v181_real.py
      - name: Remove exact external fixture cache
        if: always()
        shell: python {0}
        run: |
          import os
          import pathlib
          import shutil

          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ordifile-agilent-v181-fixture"
          if target.exists():
              shutil.rmtree(target)
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post
