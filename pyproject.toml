[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ordifile"
version = "0.5.1"
description = "Batch-convert scientific instrument files into one clean, ordered Excel workbook."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Peter Kim" }]
keywords = ["chromatography", "excel", "gc", "laboratory", "scientific-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "et-xmlfile>=2.0.0,<3",
  "olefile>=0.47,<0.48",
  "openpyxl>=3.1.5,<4",
  "XlsxWriter>=3.2.9,<4",
]

[project.optional-dependencies]
gui = [
  "PySide6-Essentials==6.11.2",
]
dev = [
  "build==1.5.0",
  "mypy>=2.3,<3",
  "pip-audit>=2.10.1,<3",
  "PySide6-Essentials==6.11.2",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<0.17",
  "types-olefile==0.47.0.20260508",
]

[project.scripts]
ordifile = "ordifile.cli.main:main"
ordifile-gui = "ordifile.desktop.app:main"

[project.urls]
Homepage = "https://github.com/hdkim99/ordifile"
Documentation = "https://github.com/hdkim99/ordifile#readme"
Issues = "https://github.com/hdkim99/ordifile/issues"
Repository = "https://github.com/hdkim99/ordifile"
Releases = "https://github.com/hdkim99/ordifile/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/ordifile"]
exclude = [
  "/src/**/* 2.py",
  "/src/**/* 2.png",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/packaging",
  "/docs",
  "/examples",
  "/LICENSE",
  "/NOTICE",
  "/THIRD_PARTY_NOTICES.md",
  "/README.md",
  "/README.ko.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/AGENTS.md",
]
exclude = [
  "/docs/**/* 2.*",
  "/packaging/**/* 2.*",
  "/scripts/**/* 2.py",
  "/src/**/* 2.py",
  "/src/**/* 2.png",
  "/tests/**/* 2.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=ordifile",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
markers = [
  "researcher_acceptance: end-to-end public researcher workflow contracts",
]
testpaths = ["tests/unit", "tests/integration"]

[tool.coverage.run]
branch = true
source = ["ordifile"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
