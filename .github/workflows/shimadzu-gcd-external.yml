name: Shimadzu GCD external fixture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordifile-shimadzu-gcd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-gcd:
    name: External / Shimadzu LabSolutions GCD
    if: github.repository == 'hdkim99/ordifile'
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 30
    env:
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Clean workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install project in the isolated environment
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --upgrade pip
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install -e ".[dev]"
      - name: Fetch the reviewed exact fixture without logging its content
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner --
          scripts/fetch_external_fixture.py
          docs/research/shimadzu-gcd-external-fixture-manifest.json
          --cache-dir "$RUNNER_TEMP/ordifile-shimadzu-gcd-fixture"
          --accept-license CC0-1.0-FS19-214-GCD
          --allow-ci
      - name: Run exact external fixture integration
        run: |
          export ORDIFILE_SHIMADZU_GCD_FIXTURE="$RUNNER_TEMP/ordifile-shimadzu-gcd-fixture/downloads/chromconverter-extra-fs19-214-gcd/d670806265f994507ac99fc676f17098bf9b9d1c362c98df1cb31154ac7a5180/FS19_214.gcd"
          python scripts/ci/run_in_venv.py run --github-runner -- -m pytest --no-cov --basetemp "$RUNNER_TEMP/ordifile-shimadzu-gcd-fixture/pytest" tests/external/test_shimadzu_gcsolution_gcd_real.py
      - name: Remove exact external fixture cache
        if: always()
        shell: python {0}
        run: |
          import os
          import pathlib
          import shutil

          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ordifile-shimadzu-gcd-fixture"
          if target.exists():
              shutil.rmtree(target)
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post
