      - name: Verify exact package-index bytes
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py index --index testpypi --root release-artifact
          python scripts/verify_release_promotion.py index --index pypi --root release-artifact

  promote-publish-github-release:
    name: Publish the verified promoted v0.2.1 GitHub Release
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'promote-existing'
    needs: [promote-validate-existing, promote-verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out the reviewed promotion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Download the validated source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.promote-validate-existing.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-artifact
          repository: hdkim99/ordifile
          run-id: ${{ needs.promote-validate-existing.outputs.source-run-id }}
      - name: Reverify indexes, attestation, tag, and draft release assets
        env:
          EXPECTED_HEAD_SHA: ${{ needs.promote-validate-existing.outputs.expected-head-sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.promote-validate-existing.outputs.release-tag }}
        run: |
          set -euo pipefail
          python scripts/verify_release_promotion.py index --index testpypi --root release-artifact
          python scripts/verify_release_promotion.py index --index pypi --root release-artifact
          gh attestation verify release-artifact/packages/* --repo "$GITHUB_REPOSITORY"
          gh attestation verify release-artifact/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("release-artifact")
          packages = root / "packages"
          expected = {path.name: path for path in packages.iterdir() if path.is_file()}
          expected["SHA256SUMS.txt"] = root / "SHA256SUMS.txt"
          if len(expected) != 3:
              raise SystemExit("Expected wheel, sdist, and SHA256SUMS.txt")
          tag = os.environ["RELEASE_TAG"]
          release = json.loads(
              subprocess.check_output(
                  ["gh", "release", "view", tag, "--json", "isDraft,tagName,assets"],
                  text=True,
              )
          )
          if release.get("isDraft") is not True or release.get("tagName") != tag:
              raise SystemExit("The expected v0.2.1 draft release is missing")
          if {asset.get("name") for asset in release.get("assets", [])} != set(expected):
              raise SystemExit("Draft release asset set differs from the source artifact")
          reference = json.loads(
              subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/tags/{tag}"],
                  text=True,
              )
          )
          target = reference.get("object", {})
          if target.get("type") != "tag":
              raise SystemExit("v0.2.1 is no longer an annotated tag")
          annotation = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "api",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/git/tags/{target.get('sha', '')}",
                  ],
                  text=True,
              )
          )
          annotated_target = annotation.get("object", {})
          if (
              annotated_target.get("type") != "commit"
              or annotated_target.get("sha") != os.environ["EXPECTED_HEAD_SHA"]
          ):
              raise SystemExit("v0.2.1 annotated tag target changed")
          destination = Path("release-download")
          destination.mkdir()
          subprocess.check_call(["gh", "release", "download", tag, "--dir", str(destination)])
          downloaded = {path.name: path for path in destination.iterdir() if path.is_file()}
          if set(downloaded) != set(expected):
              raise SystemExit("Downloaded draft asset set is incomplete")
          for name, source in expected.items():
              if hashlib.sha256(source.read_bytes()).digest() != hashlib.sha256(
                  downloaded[name].read_bytes()
              ).digest():
                  raise SystemExit(f"Draft release bytes changed for {name}")
          PY
      - name: Publish the verified existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.promote-validate-existing.outputs.release-tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  smoke:
    name: Wheel smoke / shared DGX / Python 3.14
    needs: build
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out routed source for workspace cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Clean persistent workspace before job
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated job environment
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Download the immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ordifile-distributions-${{ github.run_id }}
          path: release-artifact
      - name: Verify downloaded checksums and distributions
        shell: >-
          python scripts/ci/run_in_venv.py run --github-runner -- {0}
        run: |
          import hashlib
          from pathlib import Path

          root = Path("release-artifact")
          packages = root / "packages"
          manifest = {}
          for line in (root / "SHA256SUMS.txt").read_text(encoding="ascii").splitlines():
              expected, filename = line.split(maxsplit=1)
              if filename in manifest:
                  raise SystemExit(f"Duplicate checksum entry for {filename}")
              manifest[filename] = expected
              path = packages / filename
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Checksum mismatch for {filename}")
          entries = tuple(packages.iterdir())
          actual_files = {path.name for path in entries if path.is_file()}
          if any(not path.is_file() for path in entries) or len(manifest) != 2 or actual_files != set(manifest):
              raise SystemExit("Publish package set must be exactly the checksummed wheel and sdist")
      - name: Install and exercise the wheel outside the checkout
        shell: >-
          python scripts/ci/run_in_venv.py run --github-runner -- {0}
        run: |
          import os
          import subprocess
          import sys
          import sysconfig
          import tempfile
          from pathlib import Path

          wheel = next(Path("release-artifact/packages").glob("*.whl"))
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--no-cache-dir", str(wheel)]
          )
          from openpyxl import load_workbook

          scripts = Path(sysconfig.get_path("scripts"))
          executable = scripts / ("ordifile.exe" if os.name == "nt" else "ordifile")
          if not executable.is_file():
              raise SystemExit("Installed wheel did not provide the ordifile entry point")
          with tempfile.TemporaryDirectory(prefix="ordifile-wheel-smoke-") as raw_temp:
              work = Path(raw_temp)
              source = work / "release_smoke.csv"
              source.write_text(
                  "sample_id,peak_number,retention_time,area,compound\n"
                  "release_smoke,1,1.25,42.0,test_compound\n",
                  encoding="utf-8",
              )
              subprocess.check_call([executable, "--version"], cwd=work)
              subprocess.check_call([executable, "--help"], cwd=work, stdout=subprocess.DEVNULL)
              subprocess.check_call([executable, "formats"], cwd=work)
              subprocess.check_call([executable, "inspect", source.name], cwd=work)
              subprocess.check_call(
                  [
                      executable,
                      "convert",
                      source.name,
                      "--sort",
                      "filename",
                      "--output",
                      "Ordifile_Result.xlsx",
                  ],
                  cwd=work,
              )
              output = work / "Ordifile_Result.xlsx"
              required = {
                  "Manifest",
                  "Samples",
                  "Peak_Matrix",
                  "Peaks",
                  "Metadata",
                  "Import_Log",
              }
              workbook = load_workbook(output, read_only=True, data_only=False)
              try:
                  missing = required.difference(workbook.sheetnames)
                  if missing:
                      raise SystemExit(f"Missing workbook sheets: {sorted(missing)}")
              finally:
                  workbook.close()
      - name: Remove isolated job environment
        if: always()
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Clean persistent workspace after job
        if: always()
        run: python scripts/ci/clean_workspace.py --workspace . --phase post

