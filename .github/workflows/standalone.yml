name: Standalone prototype

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed 40-character commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ordifile-standalone-prototype-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONUTF8: "1"

jobs:
  dispatch-preflight:
    name: Validate reviewed dispatch identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unreviewed or mismatched dispatch
        shell: bash
        env:
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "${DISPATCH_REPOSITORY}" != "hdkim99/ordifile" ||
                "${DISPATCH_EVENT}" != "workflow_dispatch" ||
                "${DISPATCH_REF_TYPE}" != "branch" ]]; then
            echo "Standalone dispatch identity is not authorized." >&2
            exit 1
          fi
          if [[ "${DISPATCH_REF}" != "refs/heads/main" &&
                "${DISPATCH_REF}" != "refs/heads/build/standalone-prototype" ]]; then
            echo "Standalone dispatch ref is not authorized." >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ||
                "${DISPATCH_SHA}" != "${EXPECTED_COMMIT}" ||
                "${WORKFLOW_SHA}" != "${DISPATCH_SHA}" ]]; then
            echo "Standalone dispatch commit identity is invalid." >&2
            exit 1
          fi

  windows-prototype:
    name: Build and smoke unsigned Windows prototype
    needs: dispatch-preflight
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/build/standalone-prototype') &&
      github.sha == inputs.expected_commit &&
      github.workflow_sha == github.sha
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    steps:
      - name: Mask persistent runner identifiers
        shell: pwsh
        run: |
          $values = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            $env:RUNNER_WORKSPACE,
            $env:RUNNER_NAME,
            $env:USERNAME,
            $env:USERPROFILE,
            $env:COMPUTERNAME,
            $env:USERDOMAIN
          ) | Where-Object { $_ }
          foreach ($value in $values) {
            Write-Output "::add-mask::$value"
          }
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          path: source
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact reviewed source
        shell: pwsh
        working-directory: source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$') {
            throw "Expected commit identity is invalid."
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_COMMIT) {
            throw "Checked-out commit does not match the reviewed commit."
          }
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.3"
      - name: Clean persistent workspace before job
        working-directory: source
        run: python scripts/ci/clean_workspace.py --workspace . --phase pre
      - name: Create isolated Windows job environment
        working-directory: source
        run: python scripts/ci/run_in_venv.py create --github-runner
      - name: Install exact standalone toolchain
        working-directory: source
        run: |
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --quiet --requirement packaging/standalone/requirements-build.lock
          python scripts/ci/run_in_venv.py run --github-runner -- -m pip install --quiet --no-deps .
      - name: Create public checkout-independent smoke kit
        working-directory: source
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner -- scripts/standalone/smoke.py make-kit
          --output standalone-smoke-kit
          --generator-root tests/fixtures/synthetic
      - name: Build and audit native candidate
        working-directory: source
        run: >-
          python scripts/ci/run_in_venv.py run --github-runner -- scripts/standalone/build.py
          --source .
          --output standalone-candidate
          --commit "${{ github.sha }}"
          --target windows-x86_64
      - name: Smoke immutable Windows bytes outside the checkout
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "source"
          $candidate = Join-Path $source "standalone-candidate"
          $scratchName = "ordifile-standalone-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          if ($scratchName -notmatch '^ordifile-standalone-[0-9]+-[0-9]+-[A-Za-z0-9_-]+$') {
            throw "Standalone scratch identity is invalid."
          }
          $trimCharacters = [char[]]@(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd($trimCharacters)
          $scratch = [IO.Path]::GetFullPath((Join-Path $runnerTemp $scratchName))
          if ([IO.Path]::GetDirectoryName($scratch).TrimEnd($trimCharacters) -ne $runnerTemp) {
            throw "Standalone scratch boundary is invalid."
          }
          if (Test-Path -LiteralPath $scratch) {
            Remove-Item -LiteralPath $scratch -Recurse -Force
          }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          Copy-Item -LiteralPath (Join-Path $source "standalone-smoke-kit") `
            -Destination (Join-Path $scratch "kit") -Recurse
          $archives = @(Get-ChildItem -LiteralPath $candidate -Filter "Ordifile-*.zip" -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one standalone archive." }
          $checksum = (Get-Content -LiteralPath (Join-Path $candidate "SHA256SUMS.txt") -Raw).Trim()
          $parts = $checksum -split "\s+", 2
          if ($parts.Count -ne 2 -or $parts[1] -ne $archives[0].Name) {
            throw "Standalone checksum inventory is invalid."
          }
          if ((Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $parts[0]) {
            throw "Standalone archive checksum mismatch."
          }
          $manifest = Get-Content -LiteralPath (Join-Path $candidate "standalone-manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.publishable -ne $false -or $manifest.signature_state -ne "UNSIGNED_PROTOTYPE") {
            throw "Prototype publication/signature gate is invalid."
          }
          if ($manifest.outer_artifact.filename -ne $archives[0].Name -or
              $manifest.outer_artifact.sha256 -ne $parts[0] -or
              $manifest.outer_artifact.size -ne $archives[0].Length -or
              $manifest.bundle_total_size -le 0) {
            throw "Standalone manifest outer artifact identity is invalid."
          }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath (Join-Path $scratch "expanded")
          $executables = @(Get-ChildItem -LiteralPath (Join-Path $scratch "expanded") -Recurse -Filter "Ordifile.exe" -File)
          if ($executables.Count -ne 1) { throw "Expected exactly one packaged Ordifile executable." }
          python scripts/ci/run_in_venv.py run --github-runner -- scripts/standalone/verify.py `
            --bundle $executables[0].Directory.FullName `
            --manifest (Join-Path $candidate "standalone-manifest.json") `
            --commit "${{ github.sha }}" `
            --target windows-x86_64
          $env:PYTHONPATH = ""
          $env:PYTHONNOUSERSITE = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          Push-Location $scratch
          try {
            & $executables[0].FullName --standalone-smoke `
              --kit (Join-Path $scratch "kit") `
              --output (Join-Path $scratch "standalone smoke 결과.xlsx") `
              --report (Join-Path $scratch "standalone smoke report.json")
            if ($LASTEXITCODE -ne 0) { throw "Packaged Ordifile smoke failed." }
            & $executables[0].FullName --standalone-window-smoke
            if ($LASTEXITCODE -ne 0) { throw "Packaged Ordifile window smoke failed." }
          } finally {
            Pop-Location
          }
          $report = Get-Content -LiteralPath (Join-Path $scratch "standalone smoke report.json") -Raw | ConvertFrom-Json
          if ($report.status -ne "PASS" -or $report.existing_output_preserved -ne $true) {
            throw "Packaged Ordifile smoke report is not PASS."
          }
          Copy-Item -LiteralPath (Join-Path $scratch "standalone smoke report.json") `
            -Destination (Join-Path $source "standalone-smoke-report.json")
      - name: Upload path-free Windows evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordifile-standalone-windows-evidence-${{ github.run_id }}
          path: |
            source/standalone-candidate/standalone-manifest.json
            source/standalone-candidate/SHA256SUMS.txt
            source/standalone-smoke-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
      - name: Remove isolated Windows job environment
        if: always()
        working-directory: source
        run: python scripts/ci/run_in_venv.py remove --github-runner
      - name: Remove bounded Windows runner scratch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scratchName = "ordifile-standalone-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          if ($scratchName -notmatch '^ordifile-standalone-[0-9]+-[0-9]+-[A-Za-z0-9_-]+$') {
            throw "Standalone scratch identity is invalid."
          }
          $trimCharacters = [char[]]@(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd($trimCharacters)
          $scratch = [IO.Path]::GetFullPath((Join-Path $runnerTemp $scratchName))
          if ([IO.Path]::GetDirectoryName($scratch).TrimEnd($trimCharacters) -ne $runnerTemp) {
            throw "Standalone scratch boundary is invalid."
          }
          if (Test-Path -LiteralPath $scratch) {
            Remove-Item -LiteralPath $scratch -Recurse -Force
          }
      - name: Clean persistent workspace after job
        if: always()
        working-directory: source
        run: python scripts/ci/clean_workspace.py --workspace . --phase post

  macos-prototype:
    name: Build and smoke unsigned macOS prototype
    needs: dispatch-preflight
    if: >-
      github.repository == 'hdkim99/ordifile' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/build/standalone-prototype') &&
      github.sha == inputs.expected_commit &&
      github.workflow_sha == github.sha
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact reviewed source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected commit identity is invalid." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${EXPECTED_COMMIT}" ]]; then
            echo "Checked-out commit does not match the reviewed commit." >&2
            exit 1
          fi
      - name: Install exact official macOS Python
        shell: bash
        run: |
          set -euo pipefail
          package="${RUNNER_TEMP}/python-3.13.15-macos11.pkg"
          trap 'rm -f "${package}"' EXIT
          /usr/bin/curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "${package}" \
            https://www.python.org/ftp/python/3.13.15/python-3.13.15-macos11.pkg
          printf '%s  %s\n' \
            '3b7eaf7f29825f796e8267024435540ddf1f17fc9a97ad58095daa7a75bfdcd3' \
            "${package}" | /usr/bin/shasum -a 256 --check >/dev/null
          /usr/sbin/pkgutil --check-signature "${package}" >/dev/null
          /usr/bin/sudo -n /usr/sbin/installer -pkg "${package}" -target / >/dev/null
          python_bin="/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13"
          test "$("${python_bin}" -c 'import platform; print(platform.python_version())')" = "3.13.15"
          test "$("${python_bin}" -c 'import platform; print(platform.machine())')" = "$(uname -m)"
          test "$("${python_bin}" -c 'import sys; print(sys.prefix)')" = \
            "/Library/Frameworks/Python.framework/Versions/3.13"
          test "$("${python_bin}" -c 'import sys; print(sys.executable)')" = "${python_bin}"
          test "$("${python_bin}" -c 'import sys; print(sys.base_prefix)')" = \
            "/Library/Frameworks/Python.framework/Versions/3.13"
          echo "/Library/Frameworks/Python.framework/Versions/3.13/bin" >> "${GITHUB_PATH}"
      - name: Install exact standalone toolchain
        run: |
          python3.13 -m pip install --requirement packaging/standalone/requirements-build.lock
          python3.13 -m pip install --no-deps .
      - name: Create public checkout-independent smoke kit
        run: >-
          python3.13 scripts/standalone/smoke.py make-kit
          --output standalone-smoke-kit
          --generator-root tests/fixtures/synthetic
      - name: Select native target
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) target="macos-arm64" ;;
            x86_64) target="macos-x86_64" ;;
            *) echo "Unsupported macOS architecture." >&2; exit 1 ;;
          esac
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
      - name: Build and audit native candidate
        run: >-
          python3.13 scripts/standalone/build.py
          --source .
          --output standalone-candidate
          --commit "${{ github.sha }}"
          --target "${{ steps.platform.outputs.target }}"
      - name: Smoke immutable macOS bytes outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_WORKSPACE}/standalone-candidate"
          scratch="${RUNNER_TEMP}/ordifile-standalone-smoke"
          mkdir "${scratch}"
          cp -R "${GITHUB_WORKSPACE}/standalone-smoke-kit" "${scratch}/kit"
          read -r checksum filename < "${candidate}/SHA256SUMS.txt"
          archive="${candidate}/${filename}"
          test -f "${archive}"
          test "$(shasum -a 256 "${archive}" | awk '{print $1}')" = "${checksum}"
          grep -q '"publishable": false' "${candidate}/standalone-manifest.json"
          grep -Eq '"signature_state": "(UNSIGNED_PROTOTYPE|AD_HOC_NOT_NOTARIZED)"' \
            "${candidate}/standalone-manifest.json"
          test "$(jq -r '.outer_artifact.filename' "${candidate}/standalone-manifest.json")" = "${filename}"
          test "$(jq -r '.outer_artifact.sha256' "${candidate}/standalone-manifest.json")" = "${checksum}"
          test "$(jq -r '.outer_artifact.size' "${candidate}/standalone-manifest.json")" = "$(stat -f '%z' "${archive}")"
          test "$(jq -r '.bundle_total_size' "${candidate}/standalone-manifest.json")" -gt 0
          ditto -x -k "${archive}" "${scratch}/expanded"
          executables="$(find "${scratch}/expanded" -type f -path '*/Contents/MacOS/Ordifile' -print)"
          count="$(printf '%s\n' "${executables}" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "${count}" -eq 1
          bundle="${executables%/Contents/MacOS/Ordifile}"
          python3.13 scripts/standalone/verify.py \
            --bundle "${bundle}" \
            --manifest "${candidate}/standalone-manifest.json" \
            --commit "${{ github.sha }}" \
            --target "${{ steps.platform.outputs.target }}"
          framework="/Library/Frameworks/Python.framework/Versions/3.13"
          file_inventory="${scratch}/bundle-files.nul"
          if ! /usr/bin/find "${bundle}" -type f -print0 > "${file_inventory}" 2>/dev/null; then
            echo "The bundle file inventory failed." >&2
            exit 1
          fi
          dependency_main=0
          dependency_python=0
          dependency_extension=0
          dependency_other=0
          command_main=0
          command_python=0
          command_extension=0
          command_other=0
          while IFS= read -r -d '' member; do
            file_description="$(/usr/bin/file -b "${member}" 2>/dev/null)" || {
              echo "A bundle file-type inventory failed." >&2
              exit 1
            }
            if /usr/bin/grep -q 'Mach-O' <<< "${file_description}"; then
              relative_member="${member#"${bundle}"/}"
              dependencies="$(/usr/bin/otool -L "${member}" 2>/dev/null)" || {
                echo "A Mach-O dependency inventory failed." >&2
                exit 1
              }
              load_commands="$(/usr/bin/otool -l "${member}" 2>/dev/null)" || {
                echo "A Mach-O load-command inventory failed." >&2
                exit 1
              }
              if /usr/bin/grep -Fq "${framework}" <<< "${dependencies}"; then
                case "${relative_member}" in
                  Contents/MacOS/Ordifile) dependency_main=1 ;;
                  *Python.framework/*/Python) dependency_python=1 ;;
                  *.so | *.dylib) dependency_extension=1 ;;
                  *) dependency_other=1 ;;
                esac
              fi
              if /usr/bin/grep -Fq "${framework}" <<< "${load_commands}"; then
                case "${relative_member}" in
                  Contents/MacOS/Ordifile) command_main=1 ;;
                  *Python.framework/*/Python) command_python=1 ;;
                  *.so | *.dylib) command_extension=1 ;;
                  *) command_other=1 ;;
                esac
              fi
            fi
          done < "${file_inventory}"
          if ! /bin/rm "${file_inventory}" 2>/dev/null; then
            echo "The bundle file inventory cleanup failed." >&2
            exit 1
          fi
          framework_reference=0
          if [[ "${dependency_main}" -eq 1 ]]; then
            echo "The main executable depends on the build-host Python framework." >&2
            framework_reference=1
          fi
          if [[ "${dependency_python}" -eq 1 ]]; then
            echo "The embedded Python runtime depends on the build-host framework." >&2
            framework_reference=1
          fi
          if [[ "${dependency_extension}" -eq 1 ]]; then
            echo "An extension library depends on the build-host Python framework." >&2
            framework_reference=1
          fi
          if [[ "${dependency_other}" -eq 1 ]]; then
            echo "Another bundle component depends on the build-host Python framework." >&2
            framework_reference=1
          fi
          if [[ "${command_main}" -eq 1 ]]; then
            echo "The main executable has a build-host Python framework load command." >&2
            framework_reference=1
          fi
          if [[ "${command_python}" -eq 1 ]]; then
            echo "The embedded Python runtime has a build-host framework load command." >&2
            framework_reference=1
          fi
          if [[ "${command_extension}" -eq 1 ]]; then
            echo "An extension library has a build-host Python framework load command." >&2
            framework_reference=1
          fi
          if [[ "${command_other}" -eq 1 ]]; then
            echo "Another bundle component has a build-host Python framework load command." >&2
            framework_reference=1
          fi
          if [[ "${framework_reference}" -eq 1 ]]; then
            exit 1
          fi
          framework_name="ordifile-disabled-python-framework-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "${framework_name}" =~ ^ordifile-disabled-python-framework-[0-9]+-[0-9]+$ ]]; then
            echo "The Python framework isolation identity is invalid." >&2
            exit 1
          fi
          runner_temp="$(cd "${RUNNER_TEMP}" 2>/dev/null && /bin/pwd -P)" || {
            echo "The Python framework isolation root is invalid." >&2
            exit 1
          }
          disabled_framework="${runner_temp}/${framework_name}"
          if [[ "$(/usr/bin/dirname "${disabled_framework}")" != "${runner_temp}" ]]; then
            echo "The Python framework isolation boundary is invalid." >&2
            exit 1
          fi
          if [[ ! -d "${framework}" || -L "${framework}" ||
                ! -x "${framework}/bin/python3.13" ]]; then
            echo "The source Python framework state is invalid." >&2
            exit 1
          fi
          if [[ -e "${disabled_framework}" || -L "${disabled_framework}" ]]; then
            echo "The Python framework isolation destination is occupied." >&2
            exit 1
          fi
          restore_python_framework() {
            if [[ ! -d "${disabled_framework}" || -L "${disabled_framework}" ||
                  -e "${framework}" || -L "${framework}" ]]; then
              echo "The Python framework restore state is invalid." >&2
              return 1
            fi
            if ! /usr/bin/sudo -n /bin/mv "${disabled_framework}" "${framework}" \
                 >/dev/null 2>&1; then
              echo "The Python framework restore operation failed." >&2
              return 1
            fi
            if [[ ! -d "${framework}" || -L "${framework}" ||
                  ! -x "${framework}/bin/python3.13" ||
                  -e "${disabled_framework}" || -L "${disabled_framework}" ]]; then
              echo "The restored Python framework state is invalid." >&2
              return 1
            fi
          }
          if ! /usr/bin/sudo -n /bin/mv "${framework}" "${disabled_framework}" \
               >/dev/null 2>&1; then
            echo "The Python framework isolation operation failed." >&2
            exit 1
          fi
          trap restore_python_framework EXIT
          if [[ -e "${framework}" || -L "${framework}" ||
                ! -d "${disabled_framework}" || -L "${disabled_framework}" ]]; then
            echo "The isolated Python framework state is invalid." >&2
            exit 1
          fi
          cd "${scratch}"
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          export QT_QPA_PLATFORM=offscreen
          "${executables}" --standalone-smoke \
            --kit "${scratch}/kit" \
            --output "${scratch}/standalone smoke 결과.xlsx" \
            --report "${scratch}/standalone smoke report.json"
          "${executables}" --standalone-window-smoke
          grep -q '"status": "PASS"' "${scratch}/standalone smoke report.json"
          grep -q '"existing_output_preserved": true' "${scratch}/standalone smoke report.json"
          restore_python_framework
          trap - EXIT
          cp "${scratch}/standalone smoke report.json" "${GITHUB_WORKSPACE}/standalone-smoke-report.json"
      - name: Upload path-free macOS evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordifile-standalone-macos-evidence-${{ github.run_id }}
          path: |
            standalone-candidate/standalone-manifest.json
            standalone-candidate/SHA256SUMS.txt
            standalone-smoke-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
